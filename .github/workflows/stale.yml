name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 6 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  # Broker-routed placement keeps this job off GitHub-hosted runners, which fail at
  # job start when the org's Actions spending limit is exhausted; fail-open falls
  # back to Blacksmith, also off GitHub billing.
  choose:
    permissions:
      # OIDC token exchange with the runner broker, required by the choose-runner reusable workflow
      id-token: write
    uses: Diixtra/diixtra-forge/.github/workflows/choose-runner.yml@main
    with:
      target: standard-ci
      size: small
      docker: false
      mode: live
      fallback: blacksmith-2vcpu-ubuntu-2404

  stale:
    needs: choose
    runs-on: ${{ fromJSON(needs.choose.outputs.runs_on) }}
    steps:
      - uses: actions/stale@v10.4.0
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
