name: OpenSSF Scorecard

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # ossf/scorecard-action is a Docker container action, so under local runners
    # it needs ci-docker (dind), never ci-light (no daemon). Diixtra/diixtra-forge#4493.
    runs-on: ${{ vars.CI_LOCAL_RUNNERS == 'true' && 'ci-docker' || 'ubuntu-latest' }}
    permissions:
      # A job-level permissions block REPLACES the workflow-level read-all, so
      # without this checkout has no repo scope ("Repository not found").
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: results.sarif
