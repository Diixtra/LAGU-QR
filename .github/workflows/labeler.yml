name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ${{ vars.CI_LOCAL_RUNNERS == 'true' && 'ci-light' || 'ubuntu-latest' }}
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
